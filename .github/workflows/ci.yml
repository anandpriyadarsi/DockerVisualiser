name: DockerVisualiser checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS syntax
        run: |
          node --check src/simulator.js
          node --check src/filesystem.js
          node --check src/app.js
          node --check src/lessons.js
          node --check scripts/check-live-site.mjs
      - name: Run V1-V3 and guided lesson tests
        run: npm test
      - name: Validate static deployment package
        run: |
          npm run build
          npm run verify:release

  browser-smoke:
    name: Chromium desktop/mobile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run browser acceptance smoke
        run: node smoke/browser.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-visualiser-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
